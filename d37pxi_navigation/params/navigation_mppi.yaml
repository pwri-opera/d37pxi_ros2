planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      allow_unknown: true

      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 64
      minimum_turning_radius: 2.0

      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.4
      cost_penalty: 2.0
      retrospective_penalty: 0.015

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 5.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      goal_heading_mode: "DEFAULT"

      # 開空間での細かい最適化を弱めて、やや滑らか寄りへ
      use_quadratic_cost_penalty: true
      downsample_obstacle_heuristic: false

      smooth_path: true
      smoother:
        max_iterations: 2000
        w_smooth: 0.8
        w_data: 0.1
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 4

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: d37pxi_tf/odom
    global_frame: map
    robot_base_frame: d37pxi_tf/base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: -0.5
    rotational_acc_lim: 3.2
    use_sim_time: False
    enable_stamped_cmd_vel: false

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 10
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 0.5]
    min_velocity: [-1.0, 0.0, -0.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /d37pxi/odom_pose
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    use_sim_time: False
    enable_stamped_cmd_vel: False

