bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    odom_topic: "/d37pxi/odom_pose"

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.2
      required_movement_angle: 0.3
      movement_time_allowance: 30.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.1

    FollowPath:
      # plugin: "nav2_rotation_shim_controller::RotationShimController"
      # primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Rotation Shim
      # angular_dist_threshold: 0.5
      # forward_sampling_distance: 0.5
      # rotate_to_heading_angular_vel: 0.15
      # max_angular_accel: 3.1
      # simulate_ahead_time: 1.0
      # rotate_to_goal_heading: true
      # rotate_to_heading_once: true

      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # RPP
      desired_linear_vel: 0.5

      max_linear_vel: 0.5 # 効いていないかも
      min_linear_vel: -0.5 # 効いていないかも         
      max_angular_vel: 0.3
      min_angular_vel: -0.3

      use_dynamic_window: true

      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.2
      max_lookahead_dist: 5.0
      lookahead_time: 2.0
      
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 1.5

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 4.0
      regulated_linear_scaling_min_speed: 0.2

      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: false
      allow_reversing: true       # 後退 path を本当に使うときだけ true
      stateful: true


      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      #Costmap2D paraneters
      always_send_full_costmap: False
      use_sim_time: False
      footprint_padding: 0.5
      global_frame: d37pxi_tf/odom
      height: 20
      width: 20
      observation_sources: scan
      publish_frequency: 10.0
      resolution: 0.5
      robot_base_frame: d37pxi_tf/base_link
      rolling_window: true
      transform_tolerance: 0.25
      update_frequency: 10.0
      plugins: ["static_layer", "inflation_layer"]
      
      # Obstacle Layer parameters
      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: True
      #   observation_sources: scan
      #   scan:
      #     topic: front/scan
      #     max_obstacle_height: 2.0
      #     clearing: True
      #     marking: True
      #     data_type: "LaserScan"
      #     raytrace_max_range: 3.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 2.5
      #     obstacle_min_range: 0.0
      #   sensor_frame: front_laser
      
      #Static Layer parameters
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        always_send_full_costmap: False

      # Voxel Layer parameters
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      
      # Infration Layer parameters
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

global_costmap:
  global_costmap:
    ros__parameters:
      #Costmap2D paraneters
      always_send_full_costmap: False
      use_sim_time: False
      footprint_padding: 0.5
      global_frame: map
      height: 50
      width: 50
      observation_sources: scan
      origin_x: 0.0
      origin_y: 0.0
      publish_frequency: 5.0
      resolution: 0.1
      robot_base_frame: d37pxi_tf/base_link
      rolling_window: false
      transform_tolerance: 0.25
      update_frequency: 0.2
      plugins: ["static_layer", "inflation_layer"]
      # plugins: ["obstacle_layer", "inflation_layer"]
      
      # Obstacle Layer parameters
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: front/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        sensor_frame: front_laser
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # Voxel Layer parameters
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 1
        z_voxels: 2
      
      # Infration Layer parameters
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

