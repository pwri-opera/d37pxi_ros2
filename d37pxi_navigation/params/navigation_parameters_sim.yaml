    # default_nav_through_poses_bt_xml: "/home/common/SIP_PROJECTS/M2/SIMIZU_PROJECT/ros2_ws/install/d37pxi_navigation/share/d37pxi_navigation/config/d37pxi_navigate_through_poses_w_replanning_and_recovery.xml"
